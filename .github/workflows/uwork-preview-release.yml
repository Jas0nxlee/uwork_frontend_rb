name: UWork preview release

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Preview version extending the product version, e.g. 0.2.2-rc.1.20261111.8'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uwork-preview-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  BUILD_VERSION: ${{ inputs.build_version }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Validate immutable release inputs
        run: node .github/scripts/uwork-preview-release.mjs prepare
      - run: pnpm install --frozen-lockfile
      - run: node --test .github/scripts/uwork-preview-release.test.mjs
      - run: pnpm run build
      - name: Enterprise and settings regressions
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/installer-packaging.spec.ts
          apps/desktop/tests/macos-signature.spec.ts
          apps/desktop/tests/package-macos.spec.ts
          apps/desktop/tests/main-startup.spec.ts
          apps/desktop/tests/prepare-package-set.spec.ts
          scripts/release/process.spec.ts
          packages/credentials/uwork-enterprise/tests
          packages/llm/uwork-model-provisioning/tests
          packages/boot/uwork-gateway/tests
          packages/boot/uwork-gateway-service/tests
          packages/boot/uwork-company-market/tests
          packages/settings/settings/tests
          packages/api/settings-controller/tests
          packages/api/session-controller/tests/session-models.host.spec.ts
          packages/client/ui-settings-models/tests
          packages/client/ui-uwork-usage/tests
      - run: pnpm run doc-sync

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: win-x64
            runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DSH_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
      DSH_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Require native architecture
        shell: bash
        run: node -e "if(process.platform!==process.env.DSH_DESKTOP_TARGET_PLATFORM || process.arch!==process.env.DSH_DESKTOP_TARGET_ARCH) throw Error('Runner architecture mismatch')"
      - run: pnpm install --frozen-lockfile
      - name: Package unsigned preview and run artifact smokes
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: pnpm --dir apps/desktop exec tsx scripts/package-target.ts "$PACKAGE_TARGET" --unsigned --build-version "$BUILD_VERSION"
      - name: Collect exact installers and checksums
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: node .github/scripts/uwork-preview-release.mjs collect
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: uwork-preview-${{ matrix.target }}
          path: .artifacts/uwork-preview/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: uwork-preview-*
          path: .artifacts/uwork-preview
          merge-multiple: true
      - name: Verify both platforms from this exact commit
        run: node .github/scripts/uwork-preview-release.mjs verify
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="uwork-v${BUILD_VERSION}"
          printf '%s\n' \
            'UWork 未签名预览版：Mac ARM 与 Windows x64。' \
            '' \
            '本版将安装后的应用名称改为 UWork Next。' \
            '' \
            '此版本为未签名预览版，沿用现有独立安装标识。Windows 安装后交互需在目标机器验收。' \
            '' \
            "源码提交：${GITHUB_SHA}" \
            "构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            'SHA256SUMS 与每个平台的构建清单随安装包提供。' > .artifacts/release-notes.md
          gh release create "$tag" .artifacts/uwork-preview/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "UWork ${BUILD_VERSION}（未签名预览版）" \
            --notes-file .artifacts/release-notes.md
